# Gatus config for health.justaname.id
# Probes the JAW MCP server, the bundlers, the paymaster and ENS resolution.
# This instance is internal. The public page is web/, which reads its API and
# shows only the state of each check, never the conditions below.
#
# IMPORTANT — run this OUTSIDE your AWS/EKS (a DigitalOcean droplet, Oracle
# Cloud Always Free, or a small VPS in another provider/region). If it runs in
# the same infra it monitors, it goes down exactly when you need it to report
# the outage.
#
# Secrets: Gatus interpolates ${ENV_VAR}. Set RPC_URL to your dRPC https URL
# (the only RPC we found reliable for CCIP-Read). Supplying it via the
# X-Rpc-Url header makes /v2/resolve FREE (BYO compute) — without it the
# endpoint is PAID and returns a 402 challenge, which you do NOT want to probe.

storage:
  type: sqlite
  path: /data/gatus.db        # persist history (mount a volume here)

  # --- Multi-region with UNIFIED history ------------------------------------
  # SQLite is per-machine: each region keeps its own DB, so a 2-instance setup
  # shows two separate histories. To merge all vantage points into one status
  # page, point every instance at a shared Postgres instead and comment out the
  # two sqlite lines above:
  #
  # type: postgres
  # path: "${DATABASE_URL}"   # postgres://user:pass@host:5432/gatus?sslmode=require
  #
  # Set it via the environment (never in this file): DATABASE_URL=... in .env
  # Use a small managed Postgres outside your AWS (Supabase free, Neon free).
  # Drop the gatus-data volume from docker-compose.yml once you're on Postgres.
  # --------------------------------------------------------------------------

ui:
  title: JAW status (internal)
  header: JAW status (internal)
  description: Internal view of the JAW health checks, with conditions and history.
  default-sort-by: group

# Optional: lower the bar for what counts as "up" globally; per-endpoint
# conditions below are the real SLA gate.
metrics: true                 # exposes /metrics for Prometheus/Grafana if you want

endpoints:
  # ---------------------------------------------------------------------------
  # 1. Liveness — cheap, public, no auth, no payment, no RPC.
  #    /.well-known/x402.json is unversioned at the root and always public.
  # ---------------------------------------------------------------------------
  - name: API gateway
    group: Core services
    url: "https://api.justaname.id/.well-known/x402.json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1500"
      - "[BODY].x402Version != \"\""     # it's real JSON, not a CDN error page
    alerts:
      - type: slack

  # /api/health reads the database and the pause flag. A paused server still
  # answers 200 here but refuses every other route, so paused must be false.
  - name: MCP server
    group: Core services
    url: "https://mcp.jaw.id/api/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
      - "[BODY].db == ok"
      - "[BODY].paused == false"
    alerts:
      - type: slack

  # A USDC quote on Base through the proxy, the call wallets make before paying
  # gas in a token. An empty token list returns before any pricing, so it would
  # only prove routing. Each probe reads current prices once, from CoinGecko
  # or a Chainlink feed per the paymaster's config. Same api key and 201
  # envelope as the bundlers.
  - name: Paymaster
    group: Core services
    url: "https://api.justaname.id/proxy/v1/rpc/erc20-paymaster?chainId=8453&api-key=${BUNDLER_API_KEY}"
    method: POST
    interval: 900s
    headers:
      Content-Type: application/json
    body: '{"jsonrpc":"2.0","method":"jaw_getTokenQuotes","params":[{"tokens":["0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"]},"0x4337084D9E255Ff0702461CF8895CE9E3b5Ff108","0x2105"],"id":1}'
    ui:
      hide-url: true                   # the api key is in the query string
    conditions:
      - "[STATUS] == 201"
      - "[RESPONSE_TIME] < 5000"
      - "[BODY].result.quotes[0].token == 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    alerts:
      - type: slack

  # ---------------------------------------------------------------------------
  # 2. Forward resolution through the CCIP-Read flow (the core promise).
  #    viaUniversalResolver == true proves the CCIP-Read / Universal Resolver
  #    path actually ran — not just that the server returned 200.
  #    X-Rpc-Url makes this free; without it you'd hit the 402 paywall.
  # ---------------------------------------------------------------------------
  - name: Name resolution
    group: ENS resolution
    url: "https://api.justaname.id/ens/v2/resolve?ens=${KNOWN_NAME}&coinType=60"
    # Uses RPC_URL (a FREE public node) via X-Rpc-Url, so it costs nothing on
    # JustaName's dRPC account. Kept at 5min on purpose: free public RPCs rate-
    # limit and can disappear, so we don't lean on one with frequent probes.
    # The free liveness check below is the fast (30s) full-outage detector.
    interval: 300s
    headers:
      X-Rpc-Url: "${RPC_URL}"
      Accept: "application/json"
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 4000"
      - "[BODY].statusCode == 200"        # envelope status (error path returns non-200 here)
      - "[BODY].result.data.viaUniversalResolver == true"
      - "[BODY].result.data.ens == ${KNOWN_NAME}"
      # Optional stronger correctness check — confirm the resolved ETH address.
      # Run the request once by hand to confirm the exact JSON path, then enable:
      # - "[BODY].result.data.records.coins[0].value == ${EXPECTED_ADDRESS}"
    alerts:
      - type: slack
        send-on-resolved: true

  # ---------------------------------------------------------------------------
  # 2b. Batch resolve — exercises the multi-name path (?ens=a&ens=b). Response
  #     is an ARRAY here, so the conditions index into [0]. Still free (PublicNode).
  # ---------------------------------------------------------------------------
  - name: Batch resolution
    group: ENS resolution
    url: "https://api.justaname.id/ens/v2/resolve?ens=${KNOWN_NAME}&ens=${KNOWN_NAME_2}&coinType=60"
    interval: 300s
    headers:
      X-Rpc-Url: "${RPC_URL}"
      Accept: "application/json"
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[BODY].statusCode == 200"
      - "[BODY].result.data[0].ens == ${KNOWN_NAME}"

  # ---------------------------------------------------------------------------
  # 3. Reverse resolution (ENSIP-19) — second public surface.
  # ---------------------------------------------------------------------------
  - name: Reverse resolution
    group: ENS resolution
    url: "https://api.justaname.id/ens/v2/reverse?address=${KNOWN_ADDRESS}&coinType=60"
    # Free via PublicNode (X-Rpc-Url), same as resolve.
    interval: 300s
    headers:
      X-Rpc-Url: "${RPC_URL}"
      Accept: "application/json"
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 4000"
      - "[BODY].statusCode == 200"
    alerts:
      - type: slack
        send-on-resolved: true

  # ---------------------------------------------------------------------------
  # 4. Bundler RPC (ERC-4337) — POST JSON-RPC per chain at /proxy/v1/rpc.
  #    Auth: the api key goes as the `api-key` QUERY PARAM (not a header) — any
  #    valid JustaName api key works, no special bundler key needed. eth_chainId
  #    is trivial (no heavy on-chain compute). The POST returns 201 and a RAW
  #    JSON-RPC body ({jsonrpc,id,result}), so result is the hex chainId directly.
  #    RESPONSE_TIME is 5000 (vs 3000 elsewhere): the proxy regularly spikes to
  #    3-5s on these endpoints, so a lower bar pages on noise rather than outages.
  #    One check per mainnet that jaw.id lists. Each entry below copies the
  #    first one (<<: *bundler) and sets its name, chain id and expected result.
  # ---------------------------------------------------------------------------
  - &bundler
    name: ADI Chain
    group: Bundlers
    url: "https://api.justaname.id/proxy/v1/rpc?chainId=36900&api-key=${BUNDLER_API_KEY}"
    method: POST
    interval: 300s
    headers:
      Content-Type: application/json
    body: '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}'
    ui:
      hide-url: true                   # the api key is in the query string
    conditions: ["[STATUS] == 201", "[RESPONSE_TIME] < 5000", "[BODY].result == 0x9024"]
    alerts:
      - type: slack

  - <<: *bundler
    name: Arbitrum One
    url: "https://api.justaname.id/proxy/v1/rpc?chainId=42161&api-key=${BUNDLER_API_KEY}"
    conditions: ["[STATUS] == 201", "[RESPONSE_TIME] < 5000", "[BODY].result == 0xa4b1"]

  - <<: *bundler
    name: Arc
    url: "https://api.justaname.id/proxy/v1/rpc?chainId=5042&api-key=${BUNDLER_API_KEY}"
    conditions: ["[STATUS] == 201", "[RESPONSE_TIME] < 5000", "[BODY].result == 0x13b2"]

  - <<: *bundler
    name: Avalanche
    url: "https://api.justaname.id/proxy/v1/rpc?chainId=43114&api-key=${BUNDLER_API_KEY}"
    conditions: ["[STATUS] == 201", "[RESPONSE_TIME] < 5000", "[BODY].result == 0xa86a"]

  - <<: *bundler
    name: Base
    url: "https://api.justaname.id/proxy/v1/rpc?chainId=8453&api-key=${BUNDLER_API_KEY}"
    conditions: ["[STATUS] == 201", "[RESPONSE_TIME] < 5000", "[BODY].result == 0x2105"]

  - <<: *bundler
    name: BNB Smart Chain
    url: "https://api.justaname.id/proxy/v1/rpc?chainId=56&api-key=${BUNDLER_API_KEY}"
    conditions: ["[STATUS] == 201", "[RESPONSE_TIME] < 5000", "[BODY].result == 0x38"]

  - <<: *bundler
    name: Celo
    url: "https://api.justaname.id/proxy/v1/rpc?chainId=42220&api-key=${BUNDLER_API_KEY}"
    conditions: ["[STATUS] == 201", "[RESPONSE_TIME] < 5000", "[BODY].result == 0xa4ec"]

  - <<: *bundler
    name: Citrea
    url: "https://api.justaname.id/proxy/v1/rpc?chainId=4114&api-key=${BUNDLER_API_KEY}"
    conditions: ["[STATUS] == 201", "[RESPONSE_TIME] < 5000", "[BODY].result == 0x1012"]

  - <<: *bundler
    name: Ethereum

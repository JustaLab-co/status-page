# Gatus config for health.justaname.id
# Monitors api.justaname.id — CCIP-Read resolution + reverse + liveness.
#
# IMPORTANT — run this OUTSIDE your AWS/EKS (Fly.io, Oracle Cloud Always Free,
# a small VPS in another provider/region). If it runs in the same infra it
# monitors, it goes down exactly when you need it to report the outage.
#
# Secrets: Gatus interpolates ${ENV_VAR}. Set RPC_URL to your dRPC https URL
# (the only RPC we found reliable for CCIP-Read). Supplying it via the
# X-Rpc-Url header makes /v2/resolve FREE (BYO compute) — without it the
# endpoint is PAID and returns a 402 challenge, which you do NOT want to probe.

storage:
  type: sqlite
  path: /data/gatus.db        # persist history (mount a volume here)

  # --- Multi-region with UNIFIED history ------------------------------------
  # SQLite is per-machine: each region keeps its own DB, so a 2-instance setup
  # shows two separate histories. To merge all vantage points into one status
  # page, point every instance at a shared Postgres instead and comment out the
  # two sqlite lines above:
  #
  # type: postgres
  # path: "${DATABASE_URL}"   # postgres://user:pass@host:5432/gatus?sslmode=require
  #
  # Set it as a secret (never in this file):  fly secrets set DATABASE_URL=...
  # Use a small managed Postgres outside your AWS (Fly Postgres, Supabase free,
  # Neon free). Drop the [mounts] volume from fly.toml once you're on Postgres.
  # --------------------------------------------------------------------------

ui:
  title: JustaName Status
  header: JustaName · api.justaname.id
  description: Public uptime for the JustaName CCIP-Read gateway and resolution API.

# Optional: lower the bar for what counts as "up" globally; per-endpoint
# conditions below are the real SLA gate.
metrics: true                 # exposes /metrics for Prometheus/Grafana if you want

endpoints:
  # ---------------------------------------------------------------------------
  # 1. Liveness — cheap, public, no auth, no payment, no RPC.
  #    /.well-known/x402.json is unversioned at the root and always public.
  # ---------------------------------------------------------------------------
  - name: api-liveness
    group: API
    url: "https://api.justaname.id/.well-known/x402.json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1500"
      - "[BODY].x402Version != \"\""     # it's real JSON, not a CDN error page
    alerts:
      - type: slack

  # ---------------------------------------------------------------------------
  # 2. Forward resolution through the CCIP-Read flow (the core promise).
  #    viaUniversalResolver == true proves the CCIP-Read / Universal Resolver
  #    path actually ran — not just that the server returned 200.
  #    X-Rpc-Url makes this free; without it you'd hit the 402 paywall.
  # ---------------------------------------------------------------------------
  - name: ccip-read-resolve
    group: CCIP-Read gateway
    url: "https://api.justaname.id/ens/v2/resolve?ens=${KNOWN_NAME}&coinType=60"
    # Uses RPC_URL (a FREE public node) via X-Rpc-Url, so it costs nothing on
    # JustaName's dRPC account. Kept at 5min on purpose: free public RPCs rate-
    # limit and can disappear, so we don't lean on one with frequent probes.
    # The free liveness check below is the fast (30s) full-outage detector.
    interval: 300s
    headers:
      X-Rpc-Url: "${RPC_URL}"
      Accept: "application/json"
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 4000"
      - "[BODY].statusCode == 200"        # envelope status (error path returns non-200 here)
      - "[BODY].result.data.viaUniversalResolver == true"
      - "[BODY].result.data.ens == ${KNOWN_NAME}"
      # Optional stronger correctness check — confirm the resolved ETH address.
      # Run the request once by hand to confirm the exact JSON path, then enable:
      # - "[BODY].result.data.records.coins[0].value == ${EXPECTED_ADDRESS}"
    alerts:
      - type: slack
        send-on-resolved: true

  # ---------------------------------------------------------------------------
  # 2b. Batch resolve — exercises the multi-name path (?ens=a&ens=b). Response
  #     is an ARRAY here, so the conditions index into [0]. Still free (PublicNode).
  # ---------------------------------------------------------------------------
  - name: ccip-read-resolve-batch
    group: CCIP-Read gateway
    url: "https://api.justaname.id/ens/v2/resolve?ens=${KNOWN_NAME}&ens=${KNOWN_NAME_2}&coinType=60"
    interval: 300s
    headers:
      X-Rpc-Url: "${RPC_URL}"
      Accept: "application/json"
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[BODY].statusCode == 200"
      - "[BODY].result.data[0].ens == ${KNOWN_NAME}"

  # ---------------------------------------------------------------------------
  # 3. Reverse resolution (ENSIP-19) — second public surface.
  # ---------------------------------------------------------------------------
  - name: reverse-resolution
    group: Resolution API
    url: "https://api.justaname.id/ens/v2/reverse?address=${KNOWN_ADDRESS}&coinType=60"
    # Free via PublicNode (X-Rpc-Url), same as resolve.
    interval: 300s
    headers:
      X-Rpc-Url: "${RPC_URL}"
      Accept: "application/json"
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 4000"
      - "[BODY].statusCode == 200"
    alerts:
      - type: slack
        send-on-resolved: true

  # ---------------------------------------------------------------------------
  # 4. Bundler RPC (ERC-4337) — POST JSON-RPC per chain at /proxy/v1/rpc.
  #    eth_chainId is trivial (no heavy on-chain compute). Needs an api key WITH
  #    bundler access (BUNDLER_API_KEY) — shows 403 until that's set.
  #    `result` is the hex chainId. NOTE: confirm the response shape with a real
  #    key — if the proxy wraps it in the {result:{data}} envelope, change
  #    [BODY].result to [BODY].result.data on these two checks.
  # ---------------------------------------------------------------------------
  - name: bundler-base
    group: Bundler
    url: "https://api.justaname.id/proxy/v1/rpc?chainId=8453"
    method: POST
    interval: 60s
    headers:
      Content-Type: application/json
      x-api-key: "${BUNDLER_API_KEY}"
    body: '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}'
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
      - "[BODY].result == 0x2105"        # 8453
    alerts:
      - type: slack

  - name: bundler-ethereum
    group: Bundler
    url: "https://api.justaname.id/proxy/v1/rpc?chainId=1"
    method: POST
    interval: 60s
    headers:
      Content-Type: application/json
      x-api-key: "${BUNDLER_API_KEY}"
    body: '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}'
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
      - "[BODY].result == 0x1"           # 1
    alerts:
      - type: slack

# ---------------------------------------------------------------------------
# Alerting — fill in the Slack webhook (or swap for pagerduty/discord/email).
# failure-threshold/success-threshold avoid flapping on a single blip; with a
# 99.9% monthly target (~43 min/mo) you want a couple of consecutive fails
# before paging, ideally confirmed from >1 region (run a 2nd Gatus elsewhere).
# ---------------------------------------------------------------------------
alerting:
  slack:
    webhook-url: "${SLACK_WEBHOOK_URL}"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
      description: "JustaName health check failing"

name: Bug report
description: Something in the status page or its checks is wrong
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For **security issues or leaked secrets**, do not
        file a public issue — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: e.g. The bundler check is red but the bundler is actually up.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - A check / endpoint (config.yaml)
        - Deploy / infra (Caddy, Docker)
        - The status page UI
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        Relevant Gatus logs or a screenshot. **Redact any API keys, RPC URLs
        with keys, or webhook URLs before pasting.**
      render: shell
    validations:
      required: false

# Local preview, no Caddy or TLS:
#   docker compose -f docker-compose.local.yml up --build
# Public page on http://localhost:3000, internal Gatus dashboard on
# http://localhost:8080. The probes still hit PROD (api.justaname.id) from your
# machine, so you see real check results. History lives in a throwaway volume.
services:
  gatus:
    image: twinproduction/gatus:v5.38.0
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - gatus-local-data:/data     # config.yaml stores SQLite at /data/gatus.db
    env_file:
      - .env
    restart: unless-stopped

  web:
    build: ./web
    init: true
    ports:
      - "3000:3000"
    environment:
      GATUS_URL: http://gatus:8080
      GATUS_CONFIG: /config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    depends_on:
      - gatus
    restart: unless-stopped

volumes:
  gatus-local-data:

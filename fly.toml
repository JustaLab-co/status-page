# Fly.io manifest for health.justaname.id (Gatus).
# Runs on Fly (not AWS) so the status page survives an api.justaname.id outage.
# Rename `app` to something unique before first deploy.

app = "justaname-status-page"
primary_region = "fra"          # Frankfurt — close to prod for low-latency probes,
                                # different provider from your AWS. Add more regions
                                # later for multi-vantage-point checks.

[build]
  dockerfile = "Dockerfile"

[env]
  GATUS_CONFIG_PATH = "/config/config.yaml"
  # Non-secret probe targets — edit these. (Secrets go via `fly secrets set`.)
  KNOWN_NAME = "justaname.eth"
  KNOWN_ADDRESS = "0x0000000000000000000000000000000000000000"
  EXPECTED_ADDRESS = "0x0000000000000000000000000000000000000000"

[http_service]
  internal_port = 8080
  force_https = true
  # A monitor must never suspend itself — without inbound traffic Fly would
  # otherwise stop the machine and silently stop probing.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"            # Gatus's own liveness endpoint

# Persist the SQLite history across restarts/deploys.
[mounts]
  source = "gatus_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"             # Gatus is tiny
